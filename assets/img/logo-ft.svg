<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_ft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b294f" />
      <stop offset="100%" stop-color="#07182d" />
    </linearGradient>
    <linearGradient id="goldGrad_ft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="shadow_ft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Pentagon Shield (Authentic UB Seal Shape) -->
  <polygon points="120,12 222,86 183,212 57,212 18,86" 
           fill="url(#bgGrad_ft)" 
           stroke="url(#goldGrad_ft)" 
           stroke-width="5" 
           stroke-linejoin="round"
           filter="url(#shadow_ft)" />

  <!-- Inner Gold Inset Rim -->
  <polygon points="120,24 210,89 176,198 64,198 30,89" 
           fill="none" 
           stroke="url(#goldGrad_ft)" 
           stroke-width="1.8" 
           stroke-opacity="0.75"
           stroke-linejoin="round" />

  <!-- Sunburst Rays of Majapahit (Surya Majapahit) -->
  <g opacity="0.32" stroke="url(#goldGrad_ft)" stroke-width="1.2">
    <line x1="120" y1="108" x2="120" y2="40" />
    <line x1="120" y1="108" x2="168" y2="60" />
    <line x1="120" y1="108" x2="188" y2="108" />
    <line x1="120" y1="108" x2="168" y2="156" />
    <line x1="120" y1="108" x2="120" y2="176" />
    <line x1="120" y1="108" x2="72" y2="156" />
    <line x1="120" y1="108" x2="52" y2="108" />
    <line x1="120" y1="108" x2="72" y2="60" />
    <!-- Diagonal micro-rays -->
    <line x1="120" y1="108" x2="144" y2="48" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="180" y2="84" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="180" y2="132" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="144" y2="168" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="96" y2="168" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="60" y2="132" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="60" y2="84" stroke-dasharray="2,3"/>
    <line x1="120" y1="108" x2="96" y2="48" stroke-dasharray="2,3"/>
  </g>

  <!-- Central Prabu Brawijaya Royal Crown & Sacred Emblem -->
  <g transform="translate(120, 102)" fill="url(#goldGrad_ft)" filter="url(#shadow_ft)">
    <!-- Candra Kapala Crown -->
    <path d="M-22,-36 L-10,-48 L0,-56 L10,-48 L22,-36 L16,-28 L0,-32 L-16,-28 Z" />
    <circle cx="0" cy="-40" r="3" fill="#fff" />
    <circle cx="-12" cy="-34" r="2" fill="#fff" />
    <circle cx="12" cy="-34" r="2" fill="#fff" />

    <!-- Royal Face & Nimbus -->
    <path d="M-14,-26 C-14,-14 -8,-8 0,-8 C8,-8 14,-14 14,-26 C9,-29 0,-30 -14,-26 Z" />
    <circle cx="0" cy="-20" r="1.8" fill="#07182d" />
    <path d="M-8,-16 Q0,-12 8,-16" stroke="#07182d" stroke-width="1.2" fill="none" />

    <!-- Wisnu Divine Torso with 4 Symbolic Arms -->
    <!-- Torso -->
    <path d="M-11,-7 L11,-7 L14,18 L-14,18 Z" />
    <!-- Chest Jewel (Kaustubha) -->
    <polygon points="0,-2 5,4 0,10 -5,4" fill="#fff" opacity="0.9" />

    <!-- Left Upper Arm holding Cakra (Discus) -->
    <path d="M-11,-4 C-24,-10 -28,-22 -26,-30 L-21,-28 C-23,-22 -20,-12 -9,-2 Z" />
    <circle cx="-26" cy="-32" r="7" fill="none" stroke="url(#goldGrad_ft)" stroke-width="2.5" />
    <circle cx="-26" cy="-32" r="3" fill="url(#goldGrad_ft)" />

    <!-- Right Upper Arm holding Sangkhala (Conch Shell) -->
    <path d="M11,-4 C24,-10 28,-22 26,-30 L21,-28 C23,-22 20,-12 9,-2 Z" />
    <ellipse cx="26" cy="-32" rx="5" ry="7" transform="rotate(20 26 -32)" />

    <!-- Left Lower Arm holding Gada (Mace of Justice) -->
    <path d="M-14,8 C-28,12 -32,22 -32,32 L-27,33 C-27,25 -24,17 -12,12 Z" />
    <line x1="-31" y1="18" x2="-31" y2="40" stroke="url(#goldGrad_ft)" stroke-width="3" stroke-linecap="round" />
    <circle cx="-31" cy="18" r="4.5" />

    <!-- Right Lower Arm holding Wiweka Lamp (Lamp of Wisdom) -->
    <path d="M14,8 C28,12 32,22 32,32 L27,33 C27,25 24,17 12,12 Z" />
    <ellipse cx="31" cy="24" rx="4" ry="2.5" />
    <path d="M30,22 Q31,16 33,18 Q35,20 32,24 Z" fill="#ffedd5" />

    <!-- Lotus Throne (Padmasana) -->
    <path d="M-36,20 Q-18,14 0,14 Q18,14 36,20 Q24,30 0,30 Q-24,30 -36,20 Z" />
    <path d="M-40,24 Q-20,34 0,34 Q20,34 40,24 Q30,40 0,40 Q-30,40 -40,24 Z" opacity="0.8" />
  </g>

  <!-- Lower Faculty Name Plaque -->
  <g transform="translate(120, 182)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#0f3669" stroke="url(#goldGrad_ft)" stroke-width="2"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Instrument Sans', 'Montserrat', 'Arial', sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1.5">FT UB</text>
  </g>

  <!-- Subtle Top Arch Text: UNIVERSITAS BRAWIJAYA -->
  <path id="archPath_ft" d="M 45,95 Q 120,38 195,95" fill="none" />
  <text font-family="'Instrument Sans', 'Arial', sans-serif" font-size="7.5" font-weight="700" fill="url(#goldGrad_ft)" letter-spacing="1.8">
    <textPath href="#archPath_ft" startOffset="50%" text-anchor="middle">UNIVERSITAS BRAWIJAYA</textPath>
  </text>
</svg>